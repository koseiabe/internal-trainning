services:
  api: 
    # コンテナ名を任意に設定
    container_name: api
    build: ./api
    ports: 
      - 8080:8080
    tty: true
    # compose内では相対パスでも良い。:cachedはオプションでより早く処理されるがデータの一貫性は少し低くなる
    volumes:
    - ./api:/workspace:cached

  web:
    container_name: we
    build: 
      context: ./web
      target: base
    ports:
      - 3000:3000
    environment:
      - REACT_APP_API_SERVER=http://localhost:8080/api
    tty: true
    volumes: 
      - ./web:/workspace:cached
    depends_on:
      - api
      